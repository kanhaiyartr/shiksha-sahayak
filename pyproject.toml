[project]
name = "shiksha-sahayak"
version = "0.1.0"
description = "Draft classroom materials with redaction, officer approval, audit logs, and a cost cap."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
  "anthropic>=0.49",
  "streamlit>=1.40",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
